spring.application.name=knowledge-assistant
spring.profile.active=dev

# Externalised so credentials come from the environment in any real deployment;
# the defaults after ':' keep local dev zero-config.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/knowledge_assistant}
spring.datasource.username=${DB_USERNAME:rayyanayub}
spring.datasource.password=${DB_PASSWORD:}

# Frontend origins allowed through CORS (comma-separated).
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- JWT -------------------------------------------------------------------
# HS256 signing key. MUST be >= 32 bytes; JJWT rejects a weaker key outright rather
# than silently downgrading. The default below is a DEV-ONLY value: set JWT_SECRET
# from the environment anywhere real, and rotating it invalidates every issued token.
app.jwt.secret=${JWT_SECRET:dev-only-insecure-signing-key-change-me-in-every-real-environment}
app.jwt.issuer=${JWT_ISSUER:knowledge-assistant}
# Short access TTL because an access token cannot be revoked — its lifetime IS its
# blast radius. The refresh token carries the long session and is revocable.
app.jwt.access-token-ttl=${JWT_ACCESS_TTL:15m}
app.jwt.refresh-token-ttl=${JWT_REFRESH_TTL:7d}

# --- Frontend + Mail -------------------------------------------------------
# Where password-reset links point. Must match the running frontend origin.
app.frontend.base-url=${FRONTEND_BASE_URL:http://localhost:5173}

# Sending switches itself on as soon as SMTP credentials exist: set MAIL_USERNAME
# and MAIL_PASSWORD and mail goes out. With no credentials the reset email is
# written to the log instead, so the whole flow stays testable with nothing
# configured and no secret committed anywhere.
#   Gmail requires an APP PASSWORD, not your account password - generate one at
#   https://myaccount.google.com/apppasswords (needs 2-Step Verification on).
#   Never commit it: use your IDE run configuration or the shell environment.
# MAIL_ENABLED is only for forcing the non-obvious case - false to silence a
# configured mailer, true for a relay that needs no username.
app.mail.enabled=${MAIL_ENABLED:}
app.mail.from=${MAIL_USERNAME:no-reply@bluestone.local}
app.mail.from-name=${MAIL_FROM_NAME:Knowledge Assistant}

spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
# The schema through V8 was applied before Flyway was actually wired up, so there is no
# history table to compare against. Baseline at 8 records "V1-V8 already applied" instead
# of re-running them against tables that exist; V9 onwards apply normally.
# NO baseline settings, deliberately. This project previously set
# baseline-on-migrate=true and baseline-version=8, which existed only because this
# machine's development database had V1-V8 applied by hand before Flyway was wired up.
# That database has recorded its BASELINE row permanently, so the setting could never
# fire here again — its only remaining effect was on OTHER people's machines.
#
# Measured both cases before removing it:
#   empty database            -> Flyway runs V1..V17, 12 tables, correct
#   any pre-existing table    -> Flyway baselines at V8, SKIPS V1-V8, then V9 fails
#                                with 'relation "users" does not exist'
#
# It fails loudly, which is the acceptable half. The unacceptable half is that the
# error names what is MISSING rather than what was SKIPPED, so the message points
# away from the cause. A config that changes what runs produces errors that describe
# what is absent, and the distance between those two is where debugging time goes.
spring.jpa.open-in-view=false
# Where uploaded document bytes are written, relative to the working directory.
app.uploads.dir=${UPLOADS_DIR:uploads}

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
# traceId correlates a request; userId says who it was. Both come from MDC, so every
# line inherits them without any call site having to pass them. userId is blank on
# unauthenticated requests, which is itself informative.
logging.pattern.console=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId}] [%X{userId:-anonymous}] %-40.40logger{39} : %m%n

# Hibernate's bound-parameter logging is OFF. It printed real column values, which
# for this schema means bcrypt hashes and refresh/reset token digests. Turn it on
# locally when debugging a query, never by default.
#   logging.level.org.hibernate.SQL=DEBUG
#   logging.level.org.hibernate.orm.jdbc.bind=TRACE

# There is deliberately no HTTP body logging. Logbook used to sit here at TRACE and
# wrote every request and response body to the console, which meant the plaintext
# password, the issued JWT and the refresh token on every single login. It was
# removed rather than reconfigured: a setting that can be turned back on is a leak
# waiting to recur, whereas RequestLoggingFilter never reads a body at all, so there
# is no configuration that could make it start. LogRedactionTest fails if this
# regresses.
# --- GenAI service (Month 3 Day 8) -------------------------------------------
# It binds 127.0.0.1 deliberately: no authentication, and it trusts the
# allowed_document_ids it is handed, so anyone who can reach it can read any document.
app.genai.base-url=${GENAI_BASE_URL:http://127.0.0.1:8000}

# 150s, and every revision of this number has been a measurement.
#
#   Day 1  45s  extrapolated from 20-30s, and explicitly deferred: "confirm before Day 8"
#   Day 8  90s  Day 7 measured 30.8s mean / 57.7s worst, so 45s would have abandoned
#               requests that were going to succeed
#   Day 13 150s the generation cap went 200 -> 500 tokens, and decode runs at 4-8 tok/s:
#
#                   500 tokens / 4 tok/s   = 125s
#                   + prefill (~2,500 tok) =  ~10s
#                   worst case             = ~135s   vs a 90s timeout
#
# So a slow local answer would FAIL at 90s where it previously arrived truncated — the cap
# change quietly converted "incomplete answer" into "no answer", and only the local backend
# is exposed because Gemini decodes in seconds.
#
# RAISED 150s -> 420s ON DAY 19, together with generation_max_new_tokens 500 -> 1000.
# Forced rather than chosen, and the arithmetic above was optimistic:
#
#   measured over 22 real answers, local decode is a MEDIAN OF 2.7 tok/s (range 0.4-4.8),
#   not the 4-8 that paragraph assumes. The rate falls as the prompt grows, and the prompt
#   grew when top_k went 5 -> 7.
#
#     1000 tokens at 2.7 tok/s = 374s decode, plus ~12s prefill
#      500 tokens at 2.7 tok/s = 187s        <- ALREADY over the old 150s
#
# The longest answer actually measured took 144s at the 500 cap, which was inside 150s by
# six seconds. Doubling the cap without moving this would have turned the slowest answers
# into timeouts — "the AI took too long" for a request that was working, which is the exact
# failure the 90s -> 150s change was made to prevent.
#
# SEVEN MINUTES IS NOT A DEFENSIBLE SYNCHRONOUS TIMEOUT and nobody should read it as one.
# It is the honest consequence of a 1000-token cap on a CPU that decodes at 2.7 tok/s, and
# it makes the asynchronous answer path a requirement rather than a Day 16 nicety. The
# alternatives, if seven minutes is unacceptable: put the cap back to 500, or default the
# chat path to the cloud backend, which decodes the same answer in seconds.
app.genai.timeout=420s

# A loopback connect either works at once or nothing is listening. Seconds, not minutes.
app.genai.connect-timeout=2s

# RAISED 5 -> 7 ON DAY 18b. This value is sent on every request and OVERRIDES the Python
# default, so changing it there alone would have had no effect at all.
#
# Why: the chunk answering "what is the admission policy" sat at rank 7, so a top_k of 5
# never showed it to the model, which then correctly reported that it could not answer.
# The extra slots are affordable because the Python side now spends them inside the
# best-matching document rather than on the next unrelated file — see
# genai-service/app/retrieval.py decision 5. Costs ~480 prompt tokens per question.
app.genai.top-k=7
# Measured on Day 6: 0.35 sat BELOW the noise floor (unanswerable questions score up to
# 0.518), so insufficient_context could never fire. Sent explicitly so a change on either
# side shows up in one diff instead of being silently inherited.
# LOWERED 0.60 -> 0.55 ON DAY 19. Sent on every request, so it OVERRIDES the Python
# default and changing only that side would have done nothing.
#
# Measured in genai-service/benchmarks/27_retrieval_floor.py: at 0.60 the chunk answering
# "what is university policy" scores 0.5926 and is cut, missing by 0.007. At 0.55 every
# reported failure retrieves, the golden set is unchanged at 9/9, and no unanswerable
# question retrieves anything — their ceiling is 0.5175, so 0.50 would have started
# answering questions the corpus cannot answer.
app.genai.min-score=0.55

# Earlier turns sent with each question. The service uses them only as a FALLBACK — when a
# question matches nothing on its own, e.g. "tell me in detail" — so retrieval does not pay
# for them on a normal question. Measured: that phrase scored 0 chunks alone and 5 with the
# previous turn prepended. Capped because prefill is ~280 tok/s.
app.genai.history-turns=6

# --- Rate limits (M3 D17) ---------------------------------------------------
# Honest guesses, not measurements: there is no production traffic to tune against,
# and a precise-looking figure would imply otherwise. Set where a person will never
# notice them and a script will.
#
# login: a person who has mistyped their password ten times in sixty seconds will not
# get it right on the eleventh. Reduces an online brute force from one address to
# roughly 14,400 guesses a day. Keyed by IP, because login has no user yet.
app.security.rate-limit.login-per-minute=${RATE_LIMIT_LOGIN_PER_MINUTE:10}
# register and password-reset both create real side effects — a row, an outbound
# email — on an address the caller chooses.
app.security.rate-limit.register-per-hour=${RATE_LIMIT_REGISTER_PER_HOUR:5}
app.security.rate-limit.password-reset-per-hour=${RATE_LIMIT_PASSWORD_RESET_PER_HOUR:5}
# upload: the resource protected is the EMBEDDING MODEL, not disk. Since Day 16 an
# upload runs extraction, chunking and embedding synchronously on the same CPU that
# answers every question. Keyed by user, because upload is authenticated.
app.security.rate-limit.upload-per-minute=${RATE_LIMIT_UPLOAD_PER_MINUTE:20}
app.security.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}

# X-Forwarded-For is a header a CLIENT can set. Believing it on a directly-exposed
# server lets an attacker defeat every IP-keyed limit above by varying one string.
# Enable only behind a proxy that strips and rewrites it.
app.security.trust-proxy-headers=${TRUST_PROXY_HEADERS:false}

# --- Where the logs go (M3 D18) ---------------------------------------------
# They went NOWHERE. Logging was console-only on both services, so every diagnostic
# lived in terminal scrollback and died with the window. If the backend throws at
# 2am, there was nothing to read in the morning.
#
# ROTATION IS NOT OPTIONAL. An unbounded log file is the 11,531 orphaned upload
# files of Day 16 wearing a different hat — same disk, same silence, same growth.
# total-size-cap is the backstop: max-history alone bounds the NUMBER of files, not
# the bytes, and a chatty day can still fill a disk inside the retention window.
logging.file.name=${LOG_FILE:logs/backend.log}
logging.logback.rollingpolicy.max-file-size=10MB
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.total-size-cap=200MB
# Same layout as the console, so a trace id grepped from one matches the other. The
# GenAI service's file carries the SAME trace id since Day 18 wired propagation, so
# `grep <id> logs/backend.log genai-service/logs/*` follows one question end to end.
logging.pattern.file=%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %5p [%X{traceId}] [%X{userId:-anonymous}] %-40.40logger{39} : %m%n
