# ==========================================================================
# prod profile — run locally with: --spring.profiles.active=prod
# ==========================================================================
# Not a deployment target. It exists so the production-shaped configuration is
# runnable and therefore checkable on a laptop, rather than being written once
# against an environment nobody has and discovered to be wrong on the first deploy.

# Structured logging. One line of JSON per event, which is what a log aggregator
# wants; the readable pattern stays the default because the dev audience is a human
# reading an IDE console. Spring Boot's own structured logging is used rather than a
# hand-written logback-spring.xml — MDC entries (traceId, userId) are carried through
# as fields automatically, which is the entire reason for the format.
logging.structured.format.console=ecs

# The plain pattern must not also apply, or every event is logged twice.
logging.pattern.console=

# Hibernate's SQL echo is a development affordance and pure noise in an aggregator.
spring.jpa.show-sql=false

# Swagger is a development and review tool. Leaving an API explorer on a production
# surface advertises every endpoint and payload shape to anyone who finds it.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Never let Hibernate touch the schema outside a migration.
spring.jpa.hibernate.ddl-auto=validate

# NOTE: JwtSecretValidator refuses to start under this profile unless JWT_SECRET is
# set to something other than the checked-in development key. That is deliberate and
# is the guard being exercised — see the runbook.
