# The `dev` profile. Local development, and since M3 D17 it must be set EXPLICITLY.
#
# WHY IT EXISTS AT ALL. Day 17 inverted JwtSecretValidator's rule: "no active profile"
# used to be treated as development, so a deployment that simply forgot
# SPRING_PROFILES_ACTIVE started on the signing key committed to this repository and
# warned into a log nobody reads. Absence of configuration is the state every forgetful
# deployment is in; it must not be the state that grants the most dangerous setting.
#
# The cost is paid here: `./mvnw spring-boot:run` with nothing set now refuses to start
# and names the variable that fixes it. Run it as
#
#     ./mvnw spring-boot:run -Dspring-boot.run.profiles=dev
#
# which is what .claude/launch.json does.
#
# This file is deliberately almost empty. Everything a developer needs is already the
# DEFAULT in application.properties — localhost database, console logging, the
# development signing key. The profile's job is to be declared, not to configure.
# Settings that differ for development belong here; there are none yet.

# Rate limits stay ON in development. They are easy to forget about and awkward to
# discover later, and ten login attempts a minute is not something a person hits.
app.security.rate-limit.enabled=true
