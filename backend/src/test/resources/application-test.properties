# The `test` profile. Until Day 16 this file did not exist, and that was a real defect
# rather than a tidiness issue.
#
# `app.uploads.dir` defaults to `uploads` relative to the working directory, and nothing
# overrode it for tests. So every upload test wrote its fixture bytes into the SAME
# directory the running application serves documents from, and nothing ever cleaned up.
#
# Measured when this file was written: 11,553 files in uploads/, of which 11,531
# correspond to NO document row — 2,480 of them created on this one day by repeated
# `./mvnw test` runs. Almost all are 29-33 bytes, the size of a test fixture's
# "test content" payload.
#
# Nothing broke, which is why it ran for two months. The orphans are invisible to the
# product: the document list is built from the `documents` table, so a file with no row
# is simply never looked at. It is a disk leak that grows with the test suite, and the
# day someone backs up or copies that directory it stops being invisible.
app.uploads.dir=${java.io.tmpdir}/knowledge-assistant-test-uploads

# Rate limiting OFF for tests (M3 D17). The suite runs in one JVM and every request
# arrives from the same mock address, so production limits throttle the tests rather
# than any attacker: five registrations per hour is a sensible limit and a guaranteed
# suite failure. RateLimiterTest exercises the limiter directly instead, which is
# where the behaviour is actually worth asserting.
app.security.rate-limit.enabled=false

# Logs to a temp path, NOT into the repository (M3 D18).
#
# Written at the same time as the main file logging rather than after being bitten,
# because this is the third instance of the same bug in three days: Day 16 found
# 11,531 orphaned upload files from tests writing into uploads/, and Day 18 found a
# test traceback corrupting the GenAI service's real answers.jsonl. A test that
# writes into the application's own operational data is the pattern, not the
# accident.
logging.file.name=${java.io.tmpdir}/knowledge-assistant-test/backend.log
